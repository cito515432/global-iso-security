name: Security CI

on:
  pull_request:
    branches: [main, rpm-integral]
  push:
    branches: [security-hardening-rpm-2026, diagnostic/startup-instrumentation]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:globaliso_ci;MODE=MySQL;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ci-only-random-secret-not-for-production-2026
      SEED_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      RPM_ML_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - name: Compile and test backend
        run: mvn -B test

  backend-packaged-smoke:
    needs: backend-build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: globalisosecurity
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password_only
          MYSQL_ROOT_PASSWORD: ci_root_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PORT: "18080"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/globalisosecurity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ci-only-packaged-jar-secret-with-at-least-32-characters
      SEED_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      RPM_ML_ENABLED: "false"
      STARTUP_DIAGNOSTICS: "true"
      STARTUP_DIAGNOSTIC_READY_FILE: /tmp/backend-startup-ready
      STARTUP_DIAG_REQUIRE_HEALTH: "true"
      SPRING_PROFILES_ACTIVE: diagnostic
      STARTUP_DIAG_TIMEOUT_SECONDS: "150"
      STARTUP_SMOKE_ONLY: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - name: Wait for MySQL
        working-directory: .
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -pci_root_password_only --silent; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Prepare CI schema without production access
        working-directory: .
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password_only globalisosecurity \
            < database/init/01_globalisosecurity_backup.sql
      - name: Package backend
        run: mvn -B package -DskipTests
      - name: Start packaged JAR and probe health
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/backend-startup.log"
          export JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          bash scripts/start-backend-diagnostic.sh >"$log_file" 2>&1 &
          watchdog_pid=$!
          if ! wait "$watchdog_pid"; then
            echo 'Packaged JAR smoke test failed. Startup log:'
            sed -n '1,260p' "$log_file"
            exit 1
          fi
          grep -q '\[STARTUP-DIAG\] health-ready' "$log_file"
          if grep -q 'thread-dump-requested' "$log_file"; then
            echo 'Unexpected thread dump during successful startup.'
            exit 1
          fi
          sed -n '1,260p' "$log_file"

  watchdog-signal-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"
      - name: Compile diagnostic JVM probe
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostic-probe"
          javac -d "$RUNNER_TEMP/diagnostic-probe" \
            backend/src/test/java/com/globalisosecurity/backend/StartupDiagnosticProbe.java
      - name: Verify SIGQUIT reaches the Java PID
        shell: bash
        env:
          PORT: "19999"
          JAVA_CLASSPATH: ${{ runner.temp }}/diagnostic-probe
          JAVA_MAIN_CLASS: com.globalisosecurity.backend.StartupDiagnosticProbe
          STARTUP_DIAG_TIMEOUT_SECONDS: "1"
          STARTUP_DIAG_SECOND_DUMP_DELAY_SECONDS: "1"
          STARTUP_DIAGNOSTIC_READY_FILE: ${{ runner.temp }}/diagnostic-ready
          STARTUP_SMOKE_ONLY: "false"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/watchdog-signal.log"
          if ! sh backend/scripts/start-backend-diagnostic.sh >"$log_file" 2>&1; then
            echo 'Diagnostic JVM probe exited unexpectedly:'
            sed -n '1,260p' "$log_file"
            exit 1
          fi
          grep -q 'thread-dump-requested signal=SIGQUIT' "$log_file"
          grep -q 'second-thread-dump-requested signal=SIGQUIT' "$log_file"
          grep -q 'Full thread dump' "$log_file"
          grep -q 'StartupDiagnosticProbe.main' "$log_file"
          sed -n '1,320p' "$log_file"

  backend-mysql-startup:
    needs: backend-build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: globalisosecurity
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password_only
          MYSQL_ROOT_PASSWORD: ci_root_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PORT: "18081"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/globalisosecurity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ci-only-mysql-secret-with-at-least-32-characters
      SEED_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      RPM_ML_ENABLED: "false"
      STARTUP_DIAGNOSTICS: "true"
      STARTUP_DIAGNOSTIC_READY_FILE: /tmp/backend-startup-ready
      STARTUP_DIAG_REQUIRE_HEALTH: "true"
      SPRING_PROFILES_ACTIVE: diagnostic
      STARTUP_DIAG_TIMEOUT_SECONDS: "150"
      STARTUP_SMOKE_ONLY: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -pci_root_password_only --silent; then exit 0; fi
            sleep 2
          done
          exit 1
        working-directory: .
      - name: Prepare CI schema without production access
        working-directory: .
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password_only globalisosecurity \
            < database/init/01_globalisosecurity_backup.sql
      - name: Package backend
        run: mvn -B package -DskipTests
      - name: Start packaged JAR against CI MySQL and probe health
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/backend-mysql-startup.log"
          export JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          bash scripts/start-backend-diagnostic.sh >"$log_file" 2>&1 &
          watchdog_pid=$!
          if ! wait "$watchdog_pid"; then
            echo 'MySQL packaged startup smoke test failed. Startup log:'
            sed -n '1,320p' "$log_file"
            exit 1
          fi
          sed -n '1,320p' "$log_file"

  ml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml-service/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ml-service/app
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r ml-service/requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

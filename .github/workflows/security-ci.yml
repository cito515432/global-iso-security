name: Security CI

on:
  pull_request:
    branches: [main, rpm-integral]
  push:
    branches: [security-hardening-rpm-2026]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"
          cache: maven
      - name: Compile and test backend
        run: mvn -B test

  ml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml-service/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ml-service/app
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r ml-service/requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

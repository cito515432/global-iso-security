services:
  - type: web
    name: globaliso-ml-cito515432
    runtime: docker
    plan: free
    dockerfilePath: ./ml-service/Dockerfile.render
    dockerContext: ./ml-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RPM_ML_MODEL_VERSION
        value: RPM-ML-RF-HUMANO-V1
      - key: RPM_ML_HUMAN_REVIEW_THRESHOLD
        value: 0.70
      - key: ML_API_KEY
        sync: false

  - type: web
    name: globaliso-backend-cito515432
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 3600000
      - key: CORS_ALLOWED_ORIGINS
        value: https://globaliso-frontend-cito515432.onrender.com
      - key: SEED_ENABLED
        value: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_WINDOW_MINUTES
        value: 15
      - key: LOGIN_BLOCK_MINUTES
        value: 15
      - key: PASSWORD_MIN_LENGTH
        value: 12
      - key: RPM_ML_ENABLED
        value: true
      - key: RPM_ML_URL
        value: https://globaliso-ml-cito515432.onrender.com
      - key: RPM_ML_API_KEY
        sync: false
      - key: RPM_ML_TIMEOUT_SECONDS
        value: 120

  - type: web
    name: globaliso-frontend-cito515432
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile.render
    dockerContext: ./frontend
    healthCheckPath: /pages/login.html
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        value: https://globaliso-backend-cito515432.onrender.com

spring.application.name=backend

# Render usa PORT; local/Docker Compose puede usar SERVER_PORT o 8081.
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8081}}

# Base de datos. En producción pase siempre SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/globalisosecurity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# El esquema se administra por migraciones. Nunca se modifica automáticamente por defecto.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# Evita consultas perezosas fuera de la capa transaccional y reduce accesos imprevistos a la BD.
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# Las migraciones de versión son explícitas; Hibernate nunca altera el esquema.
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

# No exponer trazas ni mensajes internos en respuestas HTTP.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT. JWT_SECRET no tiene valor por defecto deliberadamente: JwtUtil falla al arrancar si falta o es débil.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.security.session-idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:15}

# Orígenes permitidos si el frontend llama directo al backend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Almacenamiento funcional de evidencias (en producción usar volumen persistente o almacenamiento de objetos).
app.storage.evidencias=${EVIDENCE_STORAGE_PATH:./storage/evidencias}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB

# Controles de autenticación y contraseñas.
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
app.security.login.cleanup-interval-ms=${LOGIN_BUCKET_CLEANUP_INTERVAL_MS:3600000}
app.security.password.min-length=${PASSWORD_MIN_LENGTH:15}
app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}

# Secure password reset and file scanning. Production enables these after the
# SMTP sender and private ClamAV endpoint are configured in the service secrets.
app.security.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.security.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:}
app.security.password-reset.from=${PASSWORD_RESET_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
app.security.upload.scan-required=${AV_REQUIRED:true}
app.security.upload.clamav.host=${AV_CLAMD_HOST:}
app.security.upload.clamav.port=${AV_CLAMD_PORT:3310}
app.security.upload.clamav.timeout-ms=${AV_CLAMD_TIMEOUT_MS:10000}

# Semillas. Se habilitan explícitamente; no existen credenciales por defecto.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}

# Componente ML experimental para RPM. El motor determinista funciona aun si el microservicio no está disponible.
app.rpm.ml.enabled=${RPM_ML_ENABLED:false}
app.rpm.ml.url=${RPM_ML_URL:}
app.rpm.ml.api-key=${RPM_ML_API_KEY:}
app.rpm.ml.timeout-seconds=${RPM_ML_TIMEOUT_SECONDS:120}

spring.application.name=backend

# Render usa PORT; local/Docker Compose puede usar SERVER_PORT o 8081.
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8081}}

# Base de datos. En Render se puede construir por MYSQL_HOSTPORT o pasar SPRING_DATASOURCE_URL directo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/globalisosecurity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

jwt.secret=${JWT_SECRET:GlobalIsoSecurity2026ClaveSecretaCambiarEnProduccion}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Orígenes permitidos si el frontend llama directo al backend.
# Si se usa Nginx proxy /api, normalmente no se activa CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}

# Almacenamiento funcional de evidencias (en producción usar volumen persistente o almacenamiento de objetos).
app.storage.evidencias=${EVIDENCE_STORAGE_PATH:./storage/evidencias}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB

# Semilla inicial. Cambiar la contraseña del administrador en cualquier despliegue no académico.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@globalisosecurity.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123*}
app.seed.demo-data=${SEED_DEMO_DATA:false}

# Componente ML experimental para RPM. El motor determinista funciona aun si el microservicio no está disponible.
app.rpm.ml.enabled=${RPM_ML_ENABLED:false}
app.rpm.ml.url=${RPM_ML_URL:}
app.rpm.ml.api-key=${RPM_ML_API_KEY:}
app.rpm.ml.timeout-seconds=${RPM_ML_TIMEOUT_SECONDS:120}

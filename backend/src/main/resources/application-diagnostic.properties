# Opt-in diagnostics for a controlled startup investigation. Activate with the
# diagnostic profile; production defaults remain in application.properties.
spring.config.activate.on-profile=diagnostic

spring.jpa.show-sql=false
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.context=INFO
logging.level.org.springframework.beans.factory.support=INFO
logging.level.org.springframework.boot.web.servlet.context=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.com.globalisosecurity.backend=INFO
